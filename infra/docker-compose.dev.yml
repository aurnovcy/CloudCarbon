version: "3.9"

# ---------------------------------------------------------------------------
# CloudCarbon — Local Development Docker Compose
# ---------------------------------------------------------------------------
# Usage: docker compose -f infra/docker-compose.dev.yml up -d
# Extends the production compose with developer tooling.
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # PostgreSQL 15 (same as production)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudcarbon
      POSTGRES_PASSWORD: cloudcarbon
      POSTGRES_DB: cloudcarbon
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcarbon -d cloudcarbon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Redis 7 (same as production)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # CloudCarbon API — hot-reload dev mode
  # --------------------------------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudcarbon:cloudcarbon@postgres:5432/cloudcarbon
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ../apps/api/src:/app/src:ro
    command: ["poetry", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # CloudCarbon Agents
  # --------------------------------------------------------------------------
  agents:
    build:
      context: ../apps/agents
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://cloudcarbon:cloudcarbon@postgres:5432/cloudcarbon
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ../apps/agents/src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # pgAdmin — database inspection (dev only)
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cloudcarbon.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # --------------------------------------------------------------------------
  # Redis Commander — Redis inspection (dev only)
  # --------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_data:
