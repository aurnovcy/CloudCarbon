[tool.poetry]
name = "cloudcarbon-agents"
version = "0.1.0"
description = "CloudCarbon autonomous agent runner service"
authors = ["CloudCarbon Contributors"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = "^0.29.0"
redis = { version = "^5.0.0", extras = ["hiredis"] }
httpx = "^0.27.0"
pydantic = { version = "^2.7.0" }
pydantic-settings = "^2.3.0"
structlog = "^24.1.0"
tenacity = "^8.3.0"
apscheduler = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
