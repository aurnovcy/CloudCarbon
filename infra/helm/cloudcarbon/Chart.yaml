apiVersion: v2
name: cloudcarbon
description: >
  Open-source multi-cloud GreenOps platform. Provides FOCUS 1.0 ingestion,
  GHG enrichment, GreenOps recommendations, autonomous agents, and natural
  language querying across AWS, Azure, GCP, and Alibaba Cloud.
type: application
version: 0.5.0
appVersion: "0.5.0"
home: https://github.com/cloudcarbon/cloudcarbon
sources:
  - https://github.com/cloudcarbon/cloudcarbon
maintainers:
  - name: CloudCarbon Team
    email: team@cloudcarbon.io
keywords:
  - greenops
  - cloud-carbon
  - sustainability
  - finops
  - focus
  - ghg
dependencies:
  - name: postgresql
    version: "15.5.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.6.1"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
annotations:
  category: Sustainability
